name: security-check

# Weekly: what has moved since each distro's base was built (SPEC-SHARED-ROS-BASE
# §10.6). The published husarion/ros:<distro>-ros-core is pulled anonymously,
# its apt sources are pointed at today's Ubuntu snapshot and the live ROS
# repository (inside the throwaway container only), and the upgradable packages
# are listed in the job summary. The job FAILS when Ubuntu has security updates
# for the base: that is the trigger for a security base (just release <distro>
# after bumping <D>_UBUNTU_SNAPSHOT in distros.env). ROS syncs and newer ROS
# snapshots are reported, not failed on (a ROS sync is a train decision, Q3).
# Nothing is built or pushed.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, humble, lyrical]
    env:
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Upgradable since the base's snapshots
        run: |
          set -euo pipefail
          img="husarion/ros:${DISTRO}-ros-core"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/namespaces/husarion/repositories/ros/tags/${DISTRO}-ros-core")
          if [ "$code" = 404 ]; then
            echo "### ${DISTRO}: no ${img} published yet" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker pull -q "$img"
          now=$(date -u +%Y%m%dT%H%M%SZ)
          newest_ros=$(curl -fsS "http://snapshots.ros.org/${DISTRO}/" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tail -1)
          pinned_ros=$(docker image inspect -f '{{index .Config.Labels "com.husarion.ros.snapshot.ros"}}' "$img")
          pinned_ubuntu=$(docker image inspect -f '{{index .Config.Labels "com.husarion.ros.snapshot.ubuntu"}}' "$img")
          # The live repository's key (keys/ros-archive.asc, armored, the key ros2-apt-source installs).
          fpr=$(gpg --show-keys --with-colons keys/ros-archive.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          [ "$fpr" = C1CF6E31E6BADE8868B172B4F42ED6FBAB17C654 ] || { echo "keys/ros-archive.asc is $fpr" >&2; exit 1; }
          docker run --rm -e NOW="$now" -v "$PWD/keys/ros-archive.asc:/usr/share/keyrings/ros-live.asc:ro" --entrypoint bash "$img" -c '
            set -euo pipefail
            . /etc/os-release
            sed -i -E "s#snapshot.ubuntu.com/ubuntu/[0-9TZ]+#snapshot.ubuntu.com/ubuntu/${NOW}#" /etc/apt/sources.list.d/husarion-snapshot.sources
            sed -i -E "s#^URIs: http://snapshots.ros.org/.*#URIs: http://packages.ros.org/ros2/ubuntu#; s#ros-snapshots.asc#ros-live.asc#" /etc/apt/sources.list.d/husarion-snapshot.sources
            apt-get -qq update
            apt list --upgradable 2>/dev/null | tail -n +2 > /tmp/up
            echo "SECURITY $(grep -c -- "-security" /tmp/up || true)"
            echo "ROS $(grep -c "^ros-" /tmp/up || true)"
            echo "ALL $(wc -l < /tmp/up)"
            grep -- "-security" /tmp/up | sed "s/^/  sec: /" || true
          ' > /tmp/report
          sec=$(sed -n 's/^SECURITY //p' /tmp/report)
          ros=$(sed -n 's/^ROS //p' /tmp/report)
          all=$(sed -n 's/^ALL //p' /tmp/report)
          {
            echo "### ${DISTRO}"
            echo "- base snapshots: ROS ${pinned_ros} (newest available ${newest_ros}), Ubuntu ${pinned_ubuntu}"
            echo "- upgradable today: ${all} packages, ${sec} from Ubuntu security, ${ros} ROS packages"
            if [ "$sec" != 0 ]; then
              echo
              echo '```'
              grep '^  sec: ' /tmp/report | sed 's/^  sec: //'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/report
          [ "$sec" = 0 ] || { echo "::error::${DISTRO}: ${sec} Ubuntu security updates since the base's snapshot ${pinned_ubuntu}: cut a security base"; exit 1; }
