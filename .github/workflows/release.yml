# A tag YYYYMMDD[.N] (from `just release`) builds every distro in distros.env for
# amd64 and arm64, smoke-tests them, publishes husarion/ros:<distro>-ros-core-<tag>
# and -ros-base-<tag>, and moves husarion/ros:<distro>-ros-core and -ros-base.
name: release

on:
  push:
    tags: ["2*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, humble, lyrical]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y just
      - uses: docker/login-action@v3
        with:
          username: husarion
          password: ${{ secrets.DOCKERHUB_OAT }}
      - name: Refuse a version that is already published
        run: |
          if docker manifest inspect "husarion/ros:${{ matrix.distro }}-ros-core-$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "husarion/ros:${{ matrix.distro }}-ros-core-$GITHUB_REF_NAME already exists"; exit 1
          fi
      - name: Build
        run: just build ${{ matrix.distro }}
      - name: Smoke test
        run: just smoke ${{ matrix.distro }}
      - name: Push the ${{ matrix.platform.arch }} images
        run: |
          for t in ros-core ros-base; do
            ref="husarion/ros:${{ matrix.distro }}-$t-$GITHUB_REF_NAME-${{ matrix.platform.arch }}"
            docker tag "husarion/ros:${{ matrix.distro }}-$t" "$ref"
            docker push "$ref"
          done

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: husarion
          password: ${{ secrets.DOCKERHUB_OAT }}
      - name: Multi-arch tags
        run: |
          v=$GITHUB_REF_NAME
          for d in jazzy humble lyrical; do
            for t in ros-core ros-base; do
              docker buildx imagetools create -t "husarion/ros:$d-$t-$v" -t "husarion/ros:$d-$t" \
                "husarion/ros:$d-$t-$v-amd64" "husarion/ros:$d-$t-$v-arm64"
              digest=$(docker buildx imagetools inspect "husarion/ros:$d-$t-$v" --format '{{json .Manifest.Digest}}' | tr -d '"')
              echo "- \`husarion/ros:$d-$t-$v@$digest\`" >> notes.md
            done
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
